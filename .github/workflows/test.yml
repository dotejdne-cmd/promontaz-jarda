name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist odpovídá src
        run: git diff --exit-code dist/ || (echo "Spusťte npm run build a commitněte dist/" && exit 1)
